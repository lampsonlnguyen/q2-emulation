name: Experimental MIPS WASM
on:
  push:
    branches: ['web/m4-hardware-bridge']
    paths: ['wasm/**', 'web/**', '.github/workflows/build-mips-wasm.yml']
  pull_request:
    paths: ['wasm/**', 'web/**', 'compose.web.yml', '.github/workflows/build-mips-wasm.yml']
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: QEMU-Wasm ref or commit SHA
        default: origin/master
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      QEMU_WASM_REF: ${{ inputs.upstream_ref || 'origin/master' }}
      JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Check browser component codecs
        run: |
          node wasm/hardware-test.mjs
          node wasm/storage-test.mjs
          for file in web/runtime/*.js; do node --input-type=module --check < "$file"; done
      - name: Build MIPS system emulator
        run: bash wasm/build-mips.sh
      - name: Upload experimental runtime
        uses: actions/upload-artifact@v4
        with:
          name: qemu-mipsel-wasm-experimental
          path: build/wasm-mips/
          if-no-files-found: error
          retention-days: 7
      - name: Build Linux guest and assemble browser runtime
        run: bash wasm/assemble-runtime.sh
      - name: Install browser test dependencies
        run: cd build/browser-tools && npx playwright install --with-deps chromium
      - name: Serve experimental runtime
        run: docker compose -f compose.web.yml up -d --build
      - name: Verify MIPS Linux boot in browser
        run: |
          curl --retry 30 --retry-all-errors --retry-delay 1 --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1:8080/healthz
          node build/browser-tools/browser-smoke.mjs
      - name: Upload integrated runtime for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2-browser-runtime-experimental
          path: web/runtime/
          retention-days: 14
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-diagnostics
          path: browser-smoke.png
          if-no-files-found: ignore
      - name: Stop test server
        if: always()
        run: |
          docker compose -f compose.web.yml ps -a
          docker compose -f compose.web.yml logs --no-color
          docker compose -f compose.web.yml down

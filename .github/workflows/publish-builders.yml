name: Publish preserved Q2 builders
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['wasm/builders/**', '.github/workflows/publish-builders.yml']
permissions:
  contents: read
  packages: write
concurrency:
  group: q2-builder-v1
  cancel-in-progress: false
jobs:
  guest:
    strategy:
      matrix:
        kernel: ['6.6.100', '5.15.180']
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Preserve guest dependencies
        run: |
          image=ghcr.io/lampsonlnguyen/q2-emulation/guest-builder:${{ matrix.kernel }}-v1
          if docker manifest inspect "$image" >/dev/null 2>&1; then echo "Version already published"; exit 0; fi
          docker build --build-arg LINUX_VERSION=${{ matrix.kernel }} -f wasm/builders/guest.Dockerfile -t "$image" .
          docker push "$image"
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Preserve WASM dependencies
        run: |
          image=ghcr.io/lampsonlnguyen/q2-emulation/wasm-builder:v1
          if docker manifest inspect "$image" >/dev/null 2>&1; then echo "Version already published"; exit 0; fi
          bash wasm/builders/prepare-wasm.sh
          # Verify the published builder can compile without network access.
          bash wasm/build-mips.sh
          docker tag q2-wasm-builder:v1 "$image"
          docker push "$image"

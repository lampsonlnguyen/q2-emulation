name: Deploy Q2 web
on:
  workflow_run:
    workflows: ['Publish preserved Q2 builders']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ['web/**', 'wasm/**', 'docs/*.png', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Retrieve preserved builders
        run: bash wasm/builders/pull.sh
      - name: Build current runtime offline
        run: |
          bash wasm/build-mips.sh
          bash wasm/assemble-runtime.sh
          grep -qx 'CONFIG_SQUASHFS_LZO=y' build/guest/kernel.config
      - name: Prepare static site
        run: |
          mkdir -p _site/assets
          cp -R web/. _site/
          for name in window home cover-flow folder; do cp "docs/$name.png" _site/assets/; done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

name: Deploy Q2 web
on:
  push:
    branches: [main]
    paths: ['web/**', 'docs/*.png', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p web/assets
          for name in window home cover-flow folder; do
            test -s "docs/$name.png"
            cp "docs/$name.png" web/assets/
          done
          test -s web/index.html
          touch web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment

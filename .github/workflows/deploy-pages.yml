name: Deploy Q2 web
on:
  workflow_run:
    workflows: ['Publish preserved Q2 builders']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'wasm/**'
      - 'docs/*.png'
      - '.github/workflows/deploy-pages.yml'
      - '!wasm/builders/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      ready: ${{ steps.builders.outputs.ready }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Check builder availability
        id: builders
        run: |
          if docker manifest inspect ghcr.io/lampsonlnguyen/q2-emulation/wasm-builder:v1 >/dev/null 2>&1; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Required WASM builder is not published; run Publish preserved Q2 builders first.'
            exit 1
          fi
      - name: Retrieve preserved builders
        if: steps.builders.outputs.ready == 'true'
        run: bash wasm/builders/pull.sh
      - name: Build current runtime offline
        if: steps.builders.outputs.ready == 'true'
        run: |
          bash wasm/build-mips.sh
          bash wasm/assemble-runtime.sh
          grep -qx 'CONFIG_SQUASHFS_LZO=y' build/guest/kernel.config
      - name: Prepare static site
        if: steps.builders.outputs.ready == 'true'
        run: |
          mkdir -p _site/assets
          cp -R web/. _site/
          for name in window home cover-flow folder; do cp "docs/$name.png" _site/assets/; done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: steps.builders.outputs.ready == 'true'
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

name: Actual firmware browser smoke
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish preserved Q2 builders']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'web/runtime/**'
      - 'wasm/**'
      - '.github/workflows/test-firmware-browser.yml'
      - '!wasm/builders/**'
permissions:
  contents: read
  packages: read
jobs:
  firmware:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Check builder availability
        id: builders
        run: |
          if docker manifest inspect ghcr.io/lampsonlnguyen/q2-emulation/wasm-builder:v1 >/dev/null 2>&1; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Required WASM builder is not published; run Publish preserved Q2 builders first.'
            exit 1
          fi
      - name: Retrieve preserved builders
        if: steps.builders.outputs.ready == 'true'
        run: bash wasm/builders/pull.sh
      - name: Build current runtime offline
        if: steps.builders.outputs.ready == 'true'
        run: |
          bash wasm/build-mips.sh
          bash wasm/assemble-runtime.sh
          grep -qx 'CONFIG_SQUASHFS_LZO=y' build/guest/kernel.config
      - name: Download pinned upstream firmware for testing only
        if: steps.builders.outputs.ready == 'true'
        run: |
          curl -fL --retry 3 https://github.com/DiamondBond/q2-pod/releases/download/1.9.4/update.tar -o update.tar
          echo 'd41622f12bb5c7ffbd775f5d4d2bd4787514a75fb6e12765fa1a43d81af9bcb9  update.tar' | sha256sum -c -
      - name: Install browser test dependencies
        if: steps.builders.outputs.ready == 'true'
        run: |
          cp wasm/firmware-browser-smoke.mjs build/browser-tools/
          cd build/browser-tools
          npx playwright install --with-deps chromium
      - name: Start emulator server
        if: steps.builders.outputs.ready == 'true'
        run: docker compose -f compose.web.yml up -d --build
      - name: Verify actual Q2 firmware in browser
        if: steps.builders.outputs.ready == 'true'
        run: |
          curl --retry 30 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:8080/healthz
          set -o pipefail
          node build/browser-tools/firmware-browser-smoke.mjs 2>&1 | tee firmware-browser.log
      - name: Upload diagnostics (not firmware)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-browser-diagnostics
          path: |
            firmware-browser.log
            firmware-browser.png
          if-no-files-found: ignore
      - name: Stop server
        if: always()
        run: docker compose -f compose.web.yml down

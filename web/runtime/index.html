<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Q2 MIPS runtime laboratory</title><link rel="stylesheet" href="vendor/xterm.css"><style>body{font:16px system-ui;margin:24px;background:#15191e;color:#eee}a{color:#a9e3c8}button,input{font:inherit;margin:8px 0}#terminal{height:480px;border:1px solid #455;padding:8px}#status{white-space:pre-wrap}button{min-height:44px;padding:8px 12px}canvas{display:block;height:auto}section{max-width:760px}input{max-width:100%}@media(max-width:600px){body{margin:12px}#terminal{height:300px}button{margin:4px} }label{display:block}</style></head>
<body><a href="../">Q2 Emulator</a><h1>MIPS runtime laboratory</h1><p>Experimental 128 MB Malta Linux guest. This is a serial-console test, not a fully functional Q2 player.</p><p id="status" role="status">Checking browser capabilities…</p><label>Optional firmware (stock ZIP, rootfs.squashfs or update.tar)<input type="file" id="firmware" accept=".squashfs,.tar,.zip"></label><label><input type="checkbox" id="launch"> Attempt firmware demo in guest (experimental hardware bridge)</label><button id="start" disabled>Boot Linux</button><button id="reset" disabled>Reset session</button><section><h2>Virtual SD card</h2><label>Import files <input id="sd-files" type="file" multiple></label><label>Import folder <input id="sd-folder" type="file" webkitdirectory multiple></label><button id="sd-clear">Clear saved card</button><button id="sd-save" disabled>Save guest SD changes</button><button id="sd-export">Export SD ZIP</button><p id="sd-status" role="status"></p></section><section><h2>Virtual Q2 screen</h2><canvas id="screen" width="375" height="320" style="background:#000;max-width:100%;touch-action:none;image-rendering:pixelated"></canvas><div><button id="wheel-up">Wheel up</button><button id="wheel-down">Wheel down</button><button data-key="centre">Centre</button><button data-key="return">Return</button><button data-key="play">Play</button><button data-key="prev">Previous</button><button data-key="next">Next</button></div></section><button id="download-log">Download session log</button><pre id="diagnostics" style="max-height:200px;overflow:auto;white-space:pre-wrap"></pre><div id="terminal" aria-label="Serial terminal"></div><script src="vendor/xterm.js"></script><script src="vendor/xterm-pty.js"></script><script type="module" src="boot.js"></script></body></html>
